name: Build

# Run by hand from the Actions tab, or push a tag like v1.0 to also publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: dist/UltraCalc.exe
          - os: macos-latest            # Apple Silicon
            file: dist/UltraCalc-macOS.zip
          - os: ubuntu-22.04            # older glibc, so the AppImage runs on more distros
            file: dist/UltraCalc-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Get appimagetool
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"  # CI runners have no FUSE
        run: python packaging/build.py

      - name: Smoke test (terminal mode, no window)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./dist/UltraCalc-x86_64.AppImage "2^10" "5!=120"

      - uses: actions/upload-artifact@v7
        with:
          name: UltraCalc-${{ runner.os }}
          path: ${{ matrix.file }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
